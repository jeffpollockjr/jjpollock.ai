<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Goats</title>
<link rel="icon" type="image/png" href="3-goat.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #f5a623;
    --orange-hi: #ffc85e;
    --ink: #12101f;
    --panel: rgba(14, 10, 30, 0.82);
    --panel-edge: rgba(245, 166, 35, 0.35);
    --text: #efeaff;
    --muted: #b3a8d6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Nunito', sans-serif;
    color: var(--text);
    background: #0a0618 url('5-bg.jpg') center / cover no-repeat fixed;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }
  .bg-drift {
    position: fixed; inset: -4%;
    background: url('5-bg.jpg') center / cover no-repeat;
    animation: drift 90s ease-in-out infinite alternate;
    z-index: -1;
  }
  @keyframes drift {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(-1.5%, -2%) scale(1.06); }
  }
  main {
    width: 100%;
    max-width: 480px;
    padding: 28px 20px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .logo {
    width: min(280px, 70vw);
    border-radius: 999px;
    margin-bottom: 18px;
    box-shadow: 0 0 28px rgba(245, 166, 35, 0.25);
  }
  .goat {
    width: min(240px, 58vw);
    border-radius: 22px;
    border: 2px solid var(--panel-edge);
    box-shadow: 0 0 42px rgba(140, 80, 220, 0.45);
    margin-bottom: 26px;
  }
  .prompt {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .number {
    font-family: 'Titan One', sans-serif;
    font-size: clamp(44px, 12vw, 64px);
    letter-spacing: 0.04em;
    color: var(--orange);
    text-shadow: 0 3px 0 rgba(0,0,0,0.45), 0 0 30px rgba(245,166,35,0.35);
    margin-bottom: 22px;
  }
  .timer {
    font-family: 'Titan One', sans-serif;
    font-size: 26px;
    color: var(--text);
    margin-bottom: 18px;
    min-height: 32px;
  }
  .timer.low { color: #ff5d5d; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: 0.45; } }
  form {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  input[type=number], input[type=text] {
    width: 110px;
    padding: 12px 10px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 20px;
    text-align: center;
    color: var(--text);
    background: var(--panel);
    border: 2px solid rgba(179, 168, 214, 0.35);
    border-radius: 14px;
    outline: none;
    -moz-appearance: textfield;
  }
  input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; }
  input:focus { border-color: var(--orange); box-shadow: 0 0 14px rgba(245,166,35,0.35); }
  .times { font-family: 'Titan One', sans-serif; font-size: 22px; color: var(--muted); }
  .btn {
    font-family: 'Titan One', sans-serif;
    font-size: 18px;
    letter-spacing: 0.05em;
    color: var(--ink);
    background: linear-gradient(180deg, var(--orange-hi), var(--orange));
    border: none;
    border-radius: 999px;
    padding: 13px 30px;
    cursor: pointer;
    box-shadow: 0 4px 0 #9c6508, 0 0 22px rgba(245,166,35,0.35);
    transition: transform 0.08s ease;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #9c6508; }
  .copy {
    margin-top: 16px;
    background: none;
    border: none;
    color: var(--muted);
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.04em;
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
  }
  .copy:hover { color: var(--text); }
  .msg { min-height: 24px; font-weight: 800; font-size: 15px; margin-top: 10px; }
  .msg.err { color: #ff8080; }
  .overlay {
    position: fixed; inset: 0;
    background: rgba(8, 5, 20, 0.88);
    backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    padding: 24px;
    z-index: 10;
  }
  .overlay.show { display: flex; }
  .overlay h1 {
    font-family: 'Titan One', sans-serif;
    font-size: clamp(34px, 9vw, 52px);
    color: var(--orange);
    text-shadow: 0 3px 0 rgba(0,0,0,0.5), 0 0 34px rgba(245,166,35,0.4);
    margin-bottom: 14px;
  }
  .overlay p { color: var(--muted); font-weight: 700; font-size: 16px; margin-bottom: 26px; }
  .shake { animation: shake 0.4s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }
</style>
</head>
<body>
<div class="bg-drift"></div>
<main id="game">
  <img class="logo" src="4-logo.png" alt="Space Goats">
  <img class="goat" src="3-goat.png" alt="Space Goats hero goat">
  <div class="prompt">Find the two prime factors</div>
  <div class="number" id="target">1,022,117</div>
  <div class="timer" id="timer">60</div>
  <form id="factorForm" autocomplete="off">
    <input type="text" inputmode="numeric" id="f1" aria-label="First prime factor" placeholder="?">
    <span class="times">&times;</span>
    <input type="text" inputmode="numeric" id="f2" aria-label="Second prime factor" placeholder="?">
    <button class="btn" type="submit">Unlock</button>
  </form>
  <div class="msg" id="msg"></div>
  <button class="copy" id="copyBtn" type="button">Copy the problem for your AI</button>
</main>

<div class="overlay" id="timesUp">
  <h1>TIME'S UP</h1>
  <p>The herd escapes. Refresh to try again.</p>
</div>

<div class="overlay" id="unlocked">
  <img class="goat" src="3-goat.png" alt="Space Goats hero goat" style="margin-bottom:22px;">
  <h1>ACCESS GRANTED</h1>
  <p>Your AI cracked it. Welcome aboard.</p>
</div>

<script>
(function () {
  var TARGET = 1022117;
  var SECONDS = 60;
  var remaining = SECONDS;
  var timerEl = document.getElementById('timer');
  var msgEl = document.getElementById('msg');
  var form = document.getElementById('factorForm');
  var done = false;

  function isPrime(n) {
    if (n < 2 || !Number.isInteger(n)) return false;
    if (n % 2 === 0) return n === 2;
    for (var i = 3; i <= Math.sqrt(n); i += 2) if (n % i === 0) return false;
    return true;
  }

  var tick = setInterval(function () {
    remaining--;
    timerEl.textContent = remaining;
    if (remaining <= 10) timerEl.classList.add('low');
    if (remaining <= 0) {
      clearInterval(tick);
      if (!done) document.getElementById('timesUp').classList.add('show');
    }
  }, 1000);

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (done) return;
    var a = parseInt(document.getElementById('f1').value, 10);
    var b = parseInt(document.getElementById('f2').value, 10);
    if (isPrime(a) && isPrime(b) && a * b === TARGET) {
      done = true;
      clearInterval(tick);
      document.getElementById('unlocked').classList.add('show');
    } else {
      msgEl.textContent = 'Not quite.';
      msgEl.className = 'msg err';
      form.classList.remove('shake');
      void form.offsetWidth;
      form.classList.add('shake');
    }
  });

  document.getElementById('copyBtn').addEventListener('click', function () {
    var text = 'Factor ' + TARGET + ' into its two prime factors. Reply with just the two numbers.';
    var btn = this;
    function ok() { btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = 'Copy the problem for your AI'; }, 1600); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok, ok);
    } else {
      var ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      ok();
    }
  });
})();
</script>
</body>
</html>
