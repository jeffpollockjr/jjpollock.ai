<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Goats</title>
<link rel="icon" type="image/png" href="3-goat.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #f5a623;
    --orange-hi: #ffc85e;
    --ink: #12101f;
    --panel: rgba(14, 10, 30, 0.82);
    --panel-edge: rgba(245, 166, 35, 0.35);
    --text: #efeaff;
    --muted: #b3a8d6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Nunito', sans-serif;
    color: var(--text);
    background: #0a0618 url('5-bg.jpg') center / cover no-repeat fixed;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }
  .bg-drift {
    position: fixed; inset: -4%;
    background: url('5-bg.jpg') center / cover no-repeat;
    animation: drift 90s ease-in-out infinite alternate;
    z-index: -1;
  }
  @keyframes drift {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(-1.5%, -2%) scale(1.06); }
  }
  main {
    width: 100%;
    max-width: 480px;
    padding: 28px 20px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .logo {
    width: min(280px, 70vw);
    border-radius: 999px;
    margin-bottom: 18px;
    box-shadow: 0 0 28px rgba(245, 166, 35, 0.25);
  }
  .goat {
    width: min(240px, 58vw);
    border-radius: 22px;
    border: 2px solid var(--panel-edge);
    box-shadow: 0 0 42px rgba(140, 80, 220, 0.45);
    margin-bottom: 26px;
  }
  .prompt {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .number {
    font-family: 'Titan One', sans-serif;
    font-size: clamp(44px, 12vw, 64px);
    letter-spacing: 0.04em;
    color: var(--orange);
    text-shadow: 0 3px 0 rgba(0,0,0,0.45), 0 0 30px rgba(245,166,35,0.35);
    margin-bottom: 22px;
  }
  .timer {
    font-family: 'Titan One', sans-serif;
    font-size: 26px;
    color: var(--text);
    margin-bottom: 18px;
    min-height: 32px;
  }
  .timer.low { color: #ff5d5d; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: 0.45; } }
  form {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  input[type=number], input[type=text] {
    width: 110px;
    padding: 12px 10px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 20px;
    text-align: center;
    color: var(--text);
    background: var(--panel);
    border: 2px solid rgba(179, 168, 214, 0.35);
    border-radius: 14px;
    outline: none;
    -moz-appearance: textfield;
  }
  input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; }
  input:focus { border-color: var(--orange); box-shadow: 0 0 14px rgba(245,166,35,0.35); }
  .times { font-family: 'Titan One', sans-serif; font-size: 22px; color: var(--muted); }
  .btn {
    font-family: 'Titan One', sans-serif;
    font-size: 18px;
    letter-spacing: 0.05em;
    color: var(--ink);
    background: linear-gradient(180deg, var(--orange-hi), var(--orange));
    border: none;
    border-radius: 999px;
    padding: 13px 30px;
    cursor: pointer;
    box-shadow: 0 4px 0 #9c6508, 0 0 22px rgba(245,166,35,0.35);
    transition: transform 0.08s ease;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #9c6508; }
  .copy {
    margin-top: 16px;
    background: none;
    border: none;
    color: var(--muted);
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.04em;
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
  }
  .copy:hover { color: var(--text); }
  .msg { min-height: 24px; font-weight: 800; font-size: 15px; margin-top: 10px; }
  .msg.err { color: #ff8080; }
  .overlay {
    position: fixed; inset: 0;
    background: rgba(8, 5, 20, 0.88);
    backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    padding: 24px;
    z-index: 10;
  }
  .overlay.show { display: flex; }
  .overlay h1 {
    font-family: 'Titan One', sans-serif;
    font-size: clamp(34px, 9vw, 52px);
    color: var(--orange);
    text-shadow: 0 3px 0 rgba(0,0,0,0.5), 0 0 34px rgba(245,166,35,0.4);
    margin-bottom: 14px;
  }
  .overlay p { color: var(--muted); font-weight: 700; font-size: 16px; margin-bottom: 26px; }
  .shake { animation: shake 0.4s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }

  .big{font-family:'Titan One',sans-serif;font-size:clamp(34px,9vw,52px);color:var(--orange);text-shadow:0 3px 0 rgba(0,0,0,.5),0 0 34px rgba(245,166,35,.4);margin-bottom:14px;}
  .lead{color:var(--muted);font-weight:700;font-size:16px;margin-bottom:6px;}
</style>
</head>
<body>
<div class="bg-drift"></div>
<main>
  <img class="logo" src="4-logo.png" alt="Space Goats">
  <img class="goat" src="3-goat.png" alt="Space Goats hero goat">
  <h1 class="big">AIRLOCK CLEARED</h1>
  <p class="lead">Nice work, bot. Puzzle solved.</p>
  <p class="lead">Demo only: the 50% off code is not live yet.</p>
</main>
</body>
</html>
